<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>結婚式のご案内</title><style>body{margin:0;background:#fff9f7;color:#3d3435;font-family:Meiryo,sans-serif}main{max-width:680px;margin:32px auto;padding:32px;background:#fff;border:1px solid #eadbdd;border-radius:16px}h1{text-align:center;font-family:serif}h2{margin-top:30px;font-size:1.1rem}.details,.group{padding:16px;background:#fff7f7;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:10px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cdbfc1;border-radius:6px;font:inherit}textarea{min-height:80px}.radio label,.checks label{display:inline-block;width:auto;margin-right:18px}button{width:100%;padding:14px;background:#a75467;color:#fff;border:0;border-radius:8px;font-weight:bold;margin-top:24px}.hidden{display:none}.note{text-align:center;margin-top:16px}@media(max-width:500px){main{margin:16px;padding:22px}.grid{grid-template-columns:1fr}}</style></head><body><main id="app">読み込んでいます…</main><iframe id="reply" name="reply" hidden></iframe><script src="config.js"></script><script>
const app=document.querySelector('#app'),token=new URLSearchParams(location.search).get('id')||'',e=t=>{const d=document.createElement('div');d.textContent=t||'';return d.innerHTML};
function fail(x){app.innerHTML='<h1>ご案内を表示できません</h1><p class="note">'+e(x)+'</p>'}function load(){if(!token||!window.WEDDING_API_URL||WEDDING_API_URL.startsWith('PASTE_'))return fail('招待URLまたはサイト設定を確認してください。');const cb='invitationLoaded',timer=setTimeout(()=>fail('招待情報を取得できませんでした。Apps Script の公開設定と /exec URL を確認してください。'),10000);window[cb]=d=>{clearTimeout(timer);s.remove();render(d)};const s=document.createElement('script');s.src=`${WEDDING_API_URL}?action=invitation&id=${encodeURIComponent(token)}&callback=${cb}`;s.onerror=()=>{clearTimeout(timer);fail('読み込めませんでした。')};document.head.append(s)}
function render(d){if(!d.ok)return fail(d.message);if(!d.guest)return fail('Apps Script の公開バージョンが古いようです。Code.gs を更新し、新しいバージョンとして再デプロイしてください。');const p=d.guest.profile||{},v=k=>e(p[k]||''),proxies=d.guest.predefinedProxies.map(x=>`<label><input type="checkbox" name="proxy" value="${e(x)}">${e(x)}</label>`).join('')||'事前登録の代理出席者はいません。';app.innerHTML=`<h1>${e(d.groom)} ・ ${e(d.bride)}</h1><div class="details">${e(d.guest.name)} 様<br><b>${e(d.eventDate)}</b><br>${e(d.venue)}</div><p>回答期限：${e(d.replyDeadline)}</p><form id="f" action="${e(WEDDING_API_URL)}" method="post" target="reply"><input type="hidden" id="payload" name="payload"><h2>ゲスト情報</h2><div class="grid"><label>姓<input required id="lastName" value="${v('lastName')}"></label><label>名<input required id="firstName" value="${v('firstName')}"></label><label>せい（よみがな）<input required id="lastNameKana" value="${v('lastNameKana')}"></label><label>めい（よみがな）<input required id="firstNameKana" value="${v('firstNameKana')}"></label></div><div class="radio"><label><input required type="radio" name="side" value="新郎側" ${p.side==='新郎側'?'checked':''}>新郎側</label><label><input required type="radio" name="side" value="新婦側" ${p.side==='新婦側'?'checked':''}>新婦側</label></div><label>年齢区分<select required id="ageCategory"><option value="">選択してください</option>${['大人','子供','幼児'].map(x=>`<option ${p.ageCategory===x?'selected':''}>${x}</option>`).join('')}</select></label><h2>連絡先・住所</h2><label>メールアドレス<input required type="email" id="email" value="${v('email')}"></label><label>郵便番号<input required id="postalCode" value="${v('postalCode')}"></label><label>住所<input required id="address" value="${v('address')}"></label><label>建物名・部屋番号（任意）<input id="building" value="${v('building')}"></label><label>電話番号<input required type="tel" id="phone" value="${v('phone')}"></label><h2>出欠</h2><div class="radio"><label><input required type="radio" name="attendance" value="出席">出席します</label><label><input required type="radio" name="attendance" value="欠席">欠席します</label></div><section id="att"><h2>代理出席者</h2><div class="checks">${proxies}</div><label>その他の代理出席者（1名ずつ改行）<textarea id="custom"></textarea></label><h2>アレルギー・食事制限</h2><textarea id="allergies"></textarea></section><h2>メッセージ（任意）</h2><textarea id="message"></textarea><button>回答を登録する</button><div class="note" id="notice"></div></form>`;const f=document.querySelector('#f'),att=document.querySelector('#att');f.onchange=()=>att.classList.toggle('hidden',f.attendance.value==='欠席');f.onsubmit=()=>{const q=id=>document.querySelector('#'+id).value,attendance=f.attendance.value;document.querySelector('#payload').value=JSON.stringify({token,profile:{lastName:q('lastName'),firstName:q('firstName'),lastNameKana:q('lastNameKana'),firstNameKana:q('firstNameKana'),side:f.side.value,ageCategory:q('ageCategory'),email:q('email'),postalCode:q('postalCode'),address:q('address'),building:q('building'),phone:q('phone')},attendance,selectedProxies:attendance==='出席'?[...document.querySelectorAll('[name=proxy]:checked')].map(x=>x.value):[],customProxies:attendance==='出席'?q('custom').split(/\r?\n/):[],allergies:attendance==='出席'?q('allergies'):'',message:q('message')});f.querySelector('button').disabled=true;document.querySelector('#notice').textContent='登録しています…'}}
addEventListener('message',x=>{if(!x.data||x.data.type!=='wedding-response')return;const r=x.data.result;if(r.ok)app.innerHTML=`<h1>ご登録ありがとうございました</h1><p class="note">ご回答を受け付けました。${r.emailSent?'確認メールをお送りしました。':'確認メールを送信できませんでした。'}</p>`});load();
</script><script>
// Apps Script のPOST応答がブラウザのiframe制約で親画面へ届かない場合の完了表示。
// フォームの入力検証を通過して送信が開始された場合だけ実行します。
document.addEventListener('submit', event => {
  if (event.target.id !== 'f') return;
  setTimeout(() => {
    const notice = document.querySelector('#notice');
    if (notice && notice.textContent === '登録しています…') {
      app.innerHTML = '<h1>ご登録ありがとうございました</h1><p class="note">ご回答を受け付けました。確認メールが届かない場合は、迷惑メールフォルダもご確認ください。</p>';
    }
  }, 1500);
}, true);
</script></body></html>
