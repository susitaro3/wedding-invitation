<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>結婚式のご案内</title><style>body{margin:0;background:#fff9f7;color:#3d3435;font-family:Meiryo,sans-serif}main{max-width:680px;margin:32px auto;padding:32px;background:#fff;border:1px solid #eadbdd;border-radius:16px}h1{text-align:center;font-family:serif}h2{margin-top:30px;font-size:1.1rem}.details,.group{padding:16px;background:#fff7f7;border-radius:8px}.group{display:flex;align-items:center;gap:8px;margin-bottom:8px}.group span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.group button{width:auto;padding:8px 12px;margin-top:0;font-size:0.85rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:10px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cdbfc1;border-radius:6px;font:inherit}textarea{min-height:80px}.radio label,.checks label{display:inline-block;width:auto;margin-right:18px}button{width:100%;padding:14px;background:#a75467;color:#fff;border:0;border-radius:8px;font-weight:bold;margin-top:24px}.hidden{display:none}.note{text-align:center;margin-top:16px}.admin-note{color:#d32f2f;font-size:0.85rem;margin:8px 0}footer{text-align:right;font-size:0.7rem;color:#999;margin-top:40px;max-width:680px;margin:32px auto;padding:0 32px}@media(max-width:500px){main{margin:16px;padding:22px}.grid{grid-template-columns:1fr}footer{padding:0 22px}}</style></head><body><main id="app">読み込んでいます…</main><footer id="footer"></footer><script src="config.js"></script><script>
const VERSION = '1.3.2';
const app=document.querySelector('#app'),footer=document.querySelector('#footer'),token=new URLSearchParams(location.search).get('id')||'',e=t=>{const d=document.createElement('div');d.textContent=t||'';return d.innerHTML};
if(footer) footer.textContent = 'v' + VERSION;
function fail(x){app.innerHTML='<h1>ご案内を表示できません</h1><p class="note">'+e(x)+'</p>'}function load(){if(!token||!window.WEDDING_API_URL||WEDDING_API_URL.startsWith('PASTE_'))return fail('招待URLまたはサイト設定を確認してください。');const cb='invitationLoaded',timer=setTimeout(()=>fail('招待情報を取得できませんでした。Apps Script の公開設定と /exec URL を確認してください。'),10000);window[cb]=d=>{clearTimeout(timer);s.remove();render(d)};const s=document.createElement('script');s.src=`${WEDDING_API_URL}?action=invitation&id=${encodeURIComponent(token)}&callback=${cb}`;s.onerror=()=>{clearTimeout(timer);fail('読み込めませんでした。')};document.head.append(s)}
function render(d){if(!d.ok)return fail(d.message);if(!d.guest)return fail('Apps Script の公開バージョンが古いようです。Code.gs を更新し、新しいバージョンとして再デプロイしてください。');const p=d.guest.profile||{},v=k=>e(p[k]||'');app.innerHTML=`<h1>${e(d.groom)} ・ ${e(d.bride)}</h1><div class="details">${e(d.guest.name)} 様<br><b>${e(d.eventDate)}</b><br>${e(d.venue)}</div><p>回答期限：${e(d.replyDeadline)}</p><form id="f"><h2>出欠</h2><div class="radio"><label><input required type="radio" name="attendance" value="出席">出席します</label><label><input required type="radio" name="attendance" value="欠席">欠席します</label></div><div id="attFields" class="hidden"><h2>ゲスト情報</h2><div class="grid"><label>姓<input required id="lastName" value="${v('lastName')}"></label><label>名<input required id="firstName" value="${v('firstName')}"></label><label>せい（よみがな）<input required id="lastNameKana" value="${v('lastNameKana')}"></label><label>めい（よみがな）<input required id="firstNameKana" value="${v('firstNameKana')}"></label></div><div class="radio"><label><input required type="radio" name="side" value="新郎側" ${p.side==='新郎側'?'checked':''}>新郎側</label><label><input required type="radio" name="side" value="新婦側" ${p.side==='新婦側'?'checked':''}>新婦側</label></div><label>年齢区分<select required id="ageCategory"><option value="">選択してください</option>${['大人','子供','幼児'].map(x=>`<option ${p.ageCategory===x?'selected':''}>${x}</option>`).join('')}</select></label><h2>連絡先・住所</h2><label>メールアドレス<input required type="email" id="email" value="${v('email')}"></label><label>郵便番号<input required id="postalCode" value="${v('postalCode')}"></label><label>住所<input required id="address" value="${v('address')}"></label><label>建物名・部屋番号（任意）<input id="building" value="${v('building')}"></label><label>電話番号<input required type="tel" id="phone" value="${v('phone')}"></label><h2>アレルギー・食事制限</h2><textarea id="allergies"></textarea><section id="attSection"></section></div><h2>メッセージ（任意）</h2><textarea id="message"></textarea><button type="submit" id="submitBtn">回答を登録する</button><div class="note" id="notice"></div></form>`;const f=document.querySelector('#f'),attFields=document.querySelector('#attFields');f.onchange=()=>{const isAbsence=f.attendance.value==='欠席';attFields.classList.toggle('hidden',isAbsence);attFields.querySelectorAll('input,select,textarea').forEach(el=>el.disabled=isAbsence)};f.onsubmit=async e=>{e.preventDefault();if(!f.checkValidity())return;const btn=document.querySelector('#submitBtn'),notice=document.querySelector('#notice');btn.disabled=true;notice.textContent='登録しています…';const q=id=>document.querySelector('#'+id)?.value||'',attendance=f.attendance.value,payload={token,attendance,message:q('message')};if(attendance==='出席'){payload.profile={lastName:q('lastName'),firstName:q('firstName'),lastNameKana:q('lastNameKana'),firstNameKana:q('firstNameKana'),side:f.side.value,ageCategory:q('ageCategory'),email:q('email'),postalCode:q('postalCode'),address:q('address'),building:q('building'),phone:q('phone'),allergies:q('allergies')};if(window.getProxyData){const pData=window.getProxyData();payload.proxyGuests=pData.proxyGuests;payload.selectedProxies=pData.selectedProxies;}}console.log('Final payload (v'+VERSION+'):',payload);try{const formData=new URLSearchParams();formData.append('payload',JSON.stringify(payload));await fetch(window.WEDDING_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:formData});app.innerHTML='<h1>ご登録ありがとうございました</h1><p class="note">ご回答を受け付けました。確認メールが届かない場合は、迷惑メールフォルダもご確認ください。</p>'}catch(err){console.error('Submit error:',err);notice.textContent='送信エラーが発生しました。時間をおいて再度お試しください。';btn.disabled=false}}}
load();
</script><script>
(function(){const baseRender=window.render;window.render=function(d){try{baseRender(d);if(!d.guest)return;const f=document.querySelector('#f'),primary=d.guest.profile,stored=d.guest.proxyGuests||[];let rows=stored.slice();d.guest.predefinedProxies.forEach((n,i)=>{const id='fixed-'+i;if(!rows.some(x=>x.id===id))rows.push({id,predefined:true,label:n,profile:{...primary}})});const target=document.querySelector('#attSection');if(!target)return;target.innerHTML='<h2>代理出席者</h2><div id="proxyGrid"></div><button type="button" id="addProxy">代理出席者を追加</button><p class="admin-note" style="margin-top:10px">※事前定義されていない方は、新郎新婦の承認後に正式な参加となります。</p>';const grid=target.querySelector('#proxyGrid'),addBtn=target.querySelector('#addProxy');let dialog=document.getElementById('proxyDialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='proxyDialog';dialog.innerHTML='<h2>代理出席者を編集</h2><p class="admin-note">※新郎新婦の承認後に正式な参加となります。</p><div class="grid"><label>姓<input id="pxLastName"></label><label>名<input id="pxFirstName"></label><label>せい<input id="pxLastNameKana"></label><label>めい<input id="pxFirstNameKana"></label></div><label>新郎側／新婦側<select id="pxSide"><option>新郎側</option><option>新婦側</option></select></label><label>年齢区分<select id="pxAgeCategory"><option>大人</option><option>子供</option><option>幼児</option></select></label><label>メール<input id="pxEmail" type="email"></label><label>郵便番号<input id="pxPostalCode"></label><label>住所<input id="pxAddress"></label><label>建物名<input id="pxBuilding"></label><label>電話番号<input id="pxPhone"></label><label>アレルギー・食事制限<textarea id="pxAllergies"></textarea></label><button type="button" id="saveProxy">保存</button>';document.body.append(dialog)}const saveBtn=dialog.querySelector('#saveProxy');let editing=null;const keys=['lastName','firstName','lastNameKana','firstNameKana','side','ageCategory','email','postalCode','address','building','phone','allergies'];function draw(){grid.innerHTML=rows.map((r,i)=>'<div class="group"><span>'+e(r.label||((r.profile.lastName||'未入力')+' '+(r.profile.firstName||'')))+'</span><div style="display:flex;gap:4px;"><button type="button" data-edit="'+i+'">編集</button>'+(r.predefined?'':'<button type="button" data-del="'+i+'">削除</button>')+'</div></div>').join('');grid.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(+b.dataset.edit));grid.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.del,1);draw()})}function edit(i){editing=i;const p=rows[i].profile;keys.forEach(k=>{const el=dialog.querySelector('#px'+k[0].toUpperCase()+k.slice(1));if(el)el.value=p[k]||primary[k]||''});dialog.showModal()}addBtn.onclick=()=>{rows.push({id:'custom-'+Date.now(),predefined:false,profile:{...primary}});edit(rows.length-1)};saveBtn.onclick=async()=>{const p={};keys.forEach(k=>{const el=dialog.querySelector('#px'+k[0].toUpperCase()+k.slice(1));if(el)p[k]=el.value});const originalText=saveBtn.textContent;saveBtn.disabled=true;saveBtn.textContent='保存中...';try{const proxyGuest={id:rows[editing].id,predefined:rows[editing].predefined,profile:p};const payload={action:'saveProxy',token:token,proxyGuest:proxyGuest};console.log('Sending individual proxy save request (v'+VERSION+'):',proxyGuest.profile.lastName);console.table(proxyGuest.profile);const formData=new URLSearchParams();formData.append('payload',JSON.stringify(payload));await fetch(window.WEDDING_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:formData});rows[editing].profile=p;dialog.close();draw()}catch(err){console.error('Save proxy error:',err);alert('保存に失敗しました。')}finally{saveBtn.disabled=false;saveBtn.textContent=originalText}};window.getProxyData=()=>{return {proxyGuests:rows,selectedProxies:rows.map(r=>[r.profile.lastName,r.profile.firstName].filter(Boolean).join(' '))};};draw()}catch(e){console.error('Extension error:',e)}}})();
</script></body></html>
