<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小泉竜馬・大西美保夏 結婚式のご案内</title><style>
:root{--ink:#3d3435;--rose:#a75467;--pale:#fff9f7;--line:#eadbdd}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--pale);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}main{width:min(680px,calc(100% - 32px));margin:32px auto 64px;padding:36px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #bba4a633}.eyebrow{color:var(--rose);letter-spacing:.16em;font-size:.78rem;text-align:center}h1{font-family:serif;text-align:center;font-size:1.8rem;font-weight:500;margin:12px 0 26px}.details{padding:19px;text-align:center;line-height:1.85;background:#fff7f7;border-radius:10px}h2{margin:34px 0 12px;font-size:1.1rem}label{display:block;margin:11px 0;line-height:1.55}.required{color:#b23c51;font-size:.8rem}textarea{width:100%;padding:11px;border:1px solid #cdbfc1;border-radius:7px;font:inherit;min-height:95px;resize:vertical}.choice{display:flex;gap:18px;flex-wrap:wrap}.checks{padding:10px 14px;background:#fcf9f8;border-radius:7px}button{width:100%;margin-top:26px;border:0;border-radius:8px;padding:14px;color:#fff;background:var(--rose);font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#notice{margin-top:17px;text-align:center;white-space:pre-line}.hidden{display:none}.invalid{text-align:center;padding:25px 0}.small{color:#72696a;font-size:.84rem}@media(max-width:480px){main{padding:24px}}
</style></head><body><main id="app">招待状を読み込んでいます…</main><iframe id="reply" name="reply" hidden></iframe><script src="config.js"></script><script>
const app=document.querySelector('#app'), token=new URLSearchParams(location.search).get('id')||'';
const esc=t=>{const d=document.createElement('div');d.textContent=t||'';return d.innerHTML};
function fail(msg){app.innerHTML=`<div class="invalid"><h1>ご案内を表示できません</h1><p>${esc(msg)}</p></div>`}
function load(){if(!token||!window.WEDDING_API_URL||WEDDING_API_URL.startsWith('PASTE_'))return fail('招待URLまたはサイト設定を確認してください。');const cb='invitationLoaded';window[cb]=d=>{s.remove();render(d)};const s=document.createElement('script');s.src=`${WEDDING_API_URL}?action=invitation&id=${encodeURIComponent(token)}&callback=${cb}`;s.onerror=()=>fail('読み込めませんでした。時間をおいてお試しください。');document.head.append(s)}
function render(d){if(!d.ok)return fail(d.message||'招待URLを確認してください。');const candidates=d.predefinedProxies.map(n=>`<label><input type="checkbox" name="proxy" value="${esc(n)}"> ${esc(n)}</label>`).join('')||'<p class="small">事前登録の代理出席者はいません。</p>';app.innerHTML=`<div class="eyebrow">WEDDING INVITATION</div><h1>${esc(d.groom)} ・ ${esc(d.bride)}</h1><div class="details">${esc(d.guestName)} 様<br><strong>${esc(d.eventDate)}</strong><br>${esc(d.venue)}</div><p class="small">ご回答期限：${esc(d.replyDeadline)}　ご都合をお聞かせください。</p><form id="form" action="${esc(WEDDING_API_URL)}" method="post" target="reply"><input type="hidden" id="payload" name="payload"><h2>出欠 <span class="required">必須</span></h2><div class="choice"><label><input required type="radio" name="attendance" value="出席"> 出席します</label><label><input required type="radio" name="attendance" value="欠席"> 欠席します</label></div><section id="attending"><h2>代理出席者</h2><p class="small">同伴・代理で出席される方がいれば選択してください。</p><div class="checks">${candidates}</div><label>上記以外の代理出席者（任意・1名ずつ改行）<textarea id="custom" placeholder="例：山田 花子"></textarea></label><h2>アレルギー・食事制限</h2><textarea id="allergies" placeholder="該当がない場合は空欄で構いません。"></textarea></section><h2>メッセージ（任意）</h2><textarea id="message" placeholder="お祝いのメッセージなど"></textarea><button>回答を登録する</button><div id="notice"></div></form>`;const f=document.querySelector('#form'),a=document.querySelector('#attending');f.onchange=()=>a.classList.toggle('hidden',f.elements.attendance.value==='欠席');f.onsubmit=()=>{const attendance=f.elements.attendance.value,selected=attendance==='出席'?[...document.querySelectorAll('[name=proxy]:checked')].map(x=>x.value):[];document.querySelector('#payload').value=JSON.stringify({token,attendance,selectedProxies:selected,customProxies:attendance==='出席'?document.querySelector('#custom').value.split(/\r?\n/):[],allergies:attendance==='出席'?document.querySelector('#allergies').value:'',message:document.querySelector('#message').value});f.querySelector('button').disabled=true;document.querySelector('#notice').textContent='登録しています…'}}
addEventListener('message',e=>{if(e.source!==document.querySelector('#reply').contentWindow||!e.data||e.data.type!=='wedding-response')return;const r=e.data.result,n=document.querySelector('#notice'),f=document.querySelector('#form');if(r.ok){n.textContent=r.emailSent?'ご回答を登録しました。確認メールをお送りしました。':'ご回答を登録しました。';f.querySelectorAll('input,textarea,button').forEach(x=>x.disabled=true)}else{n.textContent='登録できませんでした：'+(r.message||'時間をおいてお試しください。');f.querySelector('button').disabled=false}});load();
</script></body></html>
